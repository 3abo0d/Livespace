name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: Livespace-debug, path: app/build/outputs/apk/debug/*.apk }
      - name: Commit APK to dist/ (so it can be fetched with git pull)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Livespace-debug.apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f dist/Livespace-debug.apk
          git commit -m "ci: update dist/Livespace-debug.apk [skip ci]" || exit 0
          git push
